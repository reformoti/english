<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>10-A English</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f5;
            font-family: 'Georgia', 'Times New Roman', 'Charter', 'Segoe UI', system-ui, serif;
            line-height: 1.5;
            padding: 2rem 1rem;
            color: #1e2f3a;
        }

        .wikibox {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border: 1px solid #d0d5da;
            overflow: hidden;
        }

        .wiki-header {
            background: #f5f9ff;
            border-bottom: 1px solid #dce3ec;
            padding: 1.3rem 2rem;
        }

        .wiki-header h1 {
            font-size: 1.9rem;
            font-weight: normal;
            font-family: 'Georgia', serif;
            color: #2f6b7c;
            letter-spacing: -0.2px;
            margin-bottom: 6px;
        }

        .wiki-header p {
            font-size: 0.85rem;
            color: #6f7e8c;
        }

        .wiki-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .difficulty-badge {
            background: #fef3e4;
            border: 1px solid #f0d5b0;
            padding: 4px 14px;
            font-size: 0.7rem;
            border-radius: 20px;
            color: #b47c44;
            font-family: sans-serif;
        }

        .progress-track {
            flex: 1;
            min-width: 140px;
            background: #e6eef5;
            height: 6px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            background: #6ba5b8;
            width: 0%;
            height: 100%;
            transition: width 0.2s ease;
        }

        .wiki-content {
            padding: 2rem 2rem 1.8rem;
            background: #ffffff;
        }

        .question-card {
            background: #fefcf8;
            border: 1px solid #e2e6ea;
            padding: 1.4rem 1.6rem;
            margin-bottom: 1.8rem;
        }

        .question-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 500;
            color: #6f7e8c;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #e9edf2;
            display: inline-block;
            padding-bottom: 4px;
            margin-bottom: 14px;
        }

        .ukr-text {
            font-size: 1.9rem;
            font-weight: 500;
            color: #1a4b5c;
            line-height: 1.4;
            background: #ffffff;
            padding: 0.4rem 0.1rem;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .extra-hint {
            font-size: 0.7rem;
            color: #b0aa8f;
            margin-top: 12px;
            font-style: italic;
        }

        .options-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 22px 0 18px;
        }

        .option-item {
            background: #ffffff;
            border: 1px solid #cfd9e2;
            padding: 11px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.12s linear;
        }

        .option-item:hover:not(.opt-disabled) {
            background-color: #f3f9fe;
            border-color: #8fbbd0;
            transform: translateX(2px);
        }

        .option-letter {
            font-weight: 600;
            color: #54809b;
            background: #f0f4f9;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-size: 0.9rem;
        }

        .option-english {
            font-size: 0.95rem;
            color: #2f4858;
        }

        .feedback-block {
            margin: 12px 0 20px;
            padding: 10px 16px;
            font-size: 0.9rem;
            border-left: 4px solid #d0d7de;
            background: #fafbfd;
            color: #3d5f70;
        }

        .feedback-correct {
            border-left-color: #5fae8b;
            background: #effaf4;
            color: #2a6e54;
        }

        .feedback-wrong {
            border-left-color: #e09d7c;
            background: #fef5f0;
            color: #bc694b;
        }

        .button-row {
            display: flex;
            gap: 14px;
            margin: 10px 0 12px;
            flex-wrap: wrap;
        }

        .wiki-btn {
            background: #f8fafc;
            border: 1px solid #b9c2cc;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            color: #386a7c;
            transition: 0.08s linear;
        }

        .wiki-btn-primary {
            background: #eef4fc;
            border-color: #8faec9;
            flex: 2;
        }

        .wiki-btn-primary:active {
            background: #e2ecf7;
        }

        .wiki-btn-primary:disabled {
            background: #eceff3;
            border-color: #c2cad2;
            color: #8696a4;
            cursor: default;
        }

        .wiki-btn-finish {
            background: #fef3e8;
            border-color: #e2bf94;
            color: #ad7a48;
            flex: 1;
        }

        .wiki-btn-reset {
            background: #ffffff;
            border-color: #cbd3db;
            color: #6d808e;
            width: 100%;
            margin-top: 8px;
        }

        footer {
            font-size: 0.7rem;
            color: #a7b2bc;
            border-top: 1px solid #eef2f6;
            margin-top: 28px;
            padding-top: 14px;
            text-align: center;
        }

        @media (max-width: 650px) {
            .wiki-content { padding: 1rem; }
            .ukr-text { font-size: 1.4rem; }
            .option-item { padding: 8px 14px; }
        }
    </style>
</head>
<body>
<div class="wikibox">
    <div class="wiki-header">
        <h1>10-A English · future constructions</h1>
        <p>will / be going to / be about to — Ukrainian to English translation</p>
        <div class="wiki-stats">
            <span class="difficulty-badge" id="levelLabel">dynamic generator</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
    </div>
    <div class="wiki-content">
        <div class="question-card">
            <div class="question-label">source phrase (ukrainian)</div>
            <div class="ukr-text" id="ukrPhrase">loading...</div>
            <div class="extra-hint">choose the only grammatically flawless translation</div>
        </div>

        <div class="options-area" id="optionsList"></div>
        <div class="feedback-block" id="feedbackMessage"></div>

        <div class="button-row">
            <button class="wiki-btn wiki-btn-primary" id="nextBtn" disabled>next challenge</button>
            <button class="wiki-btn wiki-btn-finish" id="finishBtn">finalise test</button>
        </div>
        <button class="wiki-btn wiki-btn-reset" id="resetBtn">restart session</button>
        <footer>prepared by lyceum student: Reshetnyk Emmanuel | dynamically generated questions</footer>
    </div>
</div>

<script>
(function(){
    let answeredCounter = 0;
    let score = 0;
    let answerLock = false;
    let currentQuestionData = null;
    let currentOptions = [];
    let currentCorrectIndex = -1;

    const ukrSpan = document.getElementById("ukrPhrase");
    const optionsDiv = document.getElementById("optionsList");
    const feedbackDiv = document.getElementById("feedbackMessage");
    const nextButton = document.getElementById("nextBtn");
    const finishButton = document.getElementById("finishBtn");
    const resetButton = document.getElementById("resetBtn");
    const levelSpan = document.getElementById("levelLabel");
    const progressFill = document.getElementById("progressFill");

    const subjects = {
        masculine: ["я", "ти", "він", "ми", "вони", "хтось", "ніхто"],
        feminine: ["вона", "моя сестра", "подруга", "жінка", "мати"],
        neutral: ["воно", "місто", "життя", "все"],
        plural: ["вони", "ми", "ви", "друзі", "люди", "студенти"]
    };

    const verbs = {
        action: ["подзвонити", "сказати", "зробити", "почати", "завершити", "відкрити", "покинути", "прийти", "піти"],
        process: ["працювати", "навчатися", "будувати", "створювати", "вивчати", "підготувати"],
        movement: ["приїхати", "полетіти", "вийти", "увійти", "повернутися"]
    };

    const objects = ["роботу", "проєкт", "зустріч", "контракт", "презентацію", "екзамен", "подорож", "справу"];
    const timeMarkers = ["завтра", "наступного тижня", "сьогодні ввечері", "через годину", "наступного місяця", "скоро"];
    const conditions = ["навіть якщо буде пізно", "незважаючи на труднощі", "якщо нічого не зміниться", "попри попередження"];
    const promises = ["обіцяю", "запевняю", "даю слово", "точно"];
    const predictions = ["я думаю", "я впевнений", "схоже", "мабуть", "згідно з прогнозом"];

    function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function generateUkrainianSentence() {
        const pattern = Math.floor(Math.random() * 12);
        let subject = randomItem([...subjects.masculine, ...subjects.feminine, ...subjects.plural]);
        let verb = randomItem([...verbs.action, ...verbs.process, ...verbs.movement]);
        let obj = randomItem(objects);
        let time = randomItem(timeMarkers);
        let condition = randomItem(conditions);
        let promise = randomItem(promises);
        let prediction = randomItem(predictions);

        if (pattern === 0) {
            return `${capitalize(subject)} ${verb} ${obj} ${time}.`;
        } else if (pattern === 1) {
            return `${capitalize(prediction)}, ${subject} ${verb} ${obj} ${time}.`;
        } else if (pattern === 2) {
            return `${capitalize(promise)}, ${subject} ${verb} ${obj} ${time}.`;
        } else if (pattern === 3) {
            return `${capitalize(subject)} ${verb} ${obj} ${time}, ${condition}.`;
        } else if (pattern === 4) {
            return `${capitalize(subject)} збирається ${verb} ${obj} ${time}.`;
        } else if (pattern === 5) {
            return `${capitalize(subject)} ось-ось ${verb} ${obj}.`;
        } else if (pattern === 6) {
            return `Подивись! ${capitalize(subject)} ${verb} ${obj} ${time}.`;
        } else if (pattern === 7) {
            return `Телефон дзвонить! Я ${verb} ${time}.`;
        } else if (pattern === 8) {
            return `Якщо ти не зупинишся, я ${verb} геть.`;
        } else if (pattern === 9) {
            return `${capitalize(subject)} має намір ${verb} ${obj} ${time}.`;
        } else if (pattern === 10) {
            return `Увага! ${capitalize(obj)} ось-ось ${verb}.`;
        } else {
            return `${capitalize(subject)} ${verb} ${obj} ${time} — це вирішено.`;
        }
    }

    function getStructureType(ukrSentence) {
        const lower = ukrSentence.toLowerCase();
        if (lower.includes("збирається")) return "going";
        if (lower.includes("ось-ось")) return "about";
        if (lower.includes("дзвонить")) return "spontaneous";
        if (lower.includes("обіцяю") || lower.includes("запевняю")) return "promise";
        if (lower.includes("я думаю") || lower.includes("я впевнений")) return "prediction";
        if (lower.includes("якщо") && lower.includes("піду")) return "threat";
        if (lower.includes("подивись")) return "evidence";
        return "neutral";
    }

    function extractVerbAndObject(ukrSentence) {
        const words = ukrSentence.split(" ");
        let verb = "зробити";
        let obj = "це";
        for (let w of words) {
            if (verbs.action.includes(w) || verbs.process.includes(w) || verbs.movement.includes(w)) {
                verb = w;
            }
            if (objects.some(o => w.includes(o))) {
                obj = w;
            }
        }
        return { verb, obj };
    }

    function generateCorrectEnglish(ukrSentence) {
        const lower = ukrSentence.toLowerCase();
        const { verb, obj } = extractVerbAndObject(ukrSentence);
        const type = getStructureType(ukrSentence);
        let verbBase = verb;
        if (verbBase.endsWith("ти")) verbBase = verbBase.slice(0, -2);
        if (verbBase === "подзвони") verbBase = "call";
        if (verbBase === "сказа") verbBase = "say";
        if (verbBase === "зроби") verbBase = "do";
        if (verbBase === "поча") verbBase = "start";
        if (verbBase === "заверши") verbBase = "finish";
        if (verbBase === "відкри") verbBase = "open";
        if (verbBase === "покину") verbBase = "leave";
        if (verbBase === "прий") verbBase = "come";
        if (verbBase === "пі") verbBase = "go";
        if (verbBase === "працюва") verbBase = "work";
        if (verbBase === "навча") verbBase = "study";
        if (verbBase === "будува") verbBase = "build";
        if (verbBase === "вивча") verbBase = "learn";
        if (verbBase === "підготува") verbBase = "prepare";
        if (verbBase === "приїха") verbBase = "arrive";
        if (verbBase === "полеті") verbBase = "fly";
        if (verbBase === "вий") verbBase = "go out";
        if (verbBase === "увій") verbBase = "enter";
        if (verbBase === "поверну") verbBase = "return";

        let subject = "I";
        if (lower.includes("він")) subject = "he";
        if (lower.includes("вона")) subject = "she";
        if (lower.includes("воно")) subject = "it";
        if (lower.includes("ми")) subject = "we";
        if (lower.includes("вони")) subject = "they";
        if (lower.includes("ти")) subject = "you";
        if (lower.includes("моя сестра")) subject = "my sister";
        if (lower.includes("друзі")) subject = "friends";
        if (lower.includes("люди")) subject = "people";
        if (lower.includes("студенти")) subject = "students";
        if (lower.includes("місто")) subject = "the city";
        if (lower.includes("життя")) subject = "life";

        if (type === "going") {
            if (subject === "I") return `I am going to ${verbBase} ${obj}`;
            if (subject === "you") return `You are going to ${verbBase} ${obj}`;
            if (subject === "he" || subject === "she" || subject === "it") return `${capitalize(subject)} is going to ${verbBase} ${obj}`;
            return `${capitalize(subject)} are going to ${verbBase} ${obj}`;
        }
        if (type === "about") {
            if (subject === "I") return `I am about to ${verbBase} ${obj}`;
            if (subject === "you") return `You are about to ${verbBase} ${obj}`;
            if (subject === "he" || subject === "she" || subject === "it") return `${capitalize(subject)} is about to ${verbBase} ${obj}`;
            return `${capitalize(subject)} are about to ${verbBase} ${obj}`;
        }
        if (type === "spontaneous") {
            return `I will answer it`;
        }
        if (type === "promise") {
            return `I promise I will ${verbBase} ${obj}`;
        }
        if (type === "threat") {
            return `I will leave`;
        }
        if (type === "evidence") {
            return `it is going to ${verbBase}`;
        }
        if (type === "prediction") {
            return `I think it will ${verbBase}`;
        }
        if (lower.includes("завтра")) {
            return `${capitalize(subject)} will ${verbBase} ${obj} tomorrow`;
        }
        if (lower.includes("next")) {
            return `${capitalize(subject)} is going to ${verbBase} ${obj} next week`;
        }
        return `${capitalize(subject)} will ${verbBase} ${obj}`;
    }

    function generateWrongOptions(correctEnglish, ukrSentence) {
        const lower = ukrSentence.toLowerCase();
        const type = getStructureType(ukrSentence);
        const wrongs = [];
        
        if (type === "going") {
            wrongs.push(correctEnglish.replace(/am going to|are going to|is going to/g, "will"));
            wrongs.push(correctEnglish.replace(/am going to|are going to|is going to/g, "").replace("  ", " "));
        } else if (type === "about") {
            wrongs.push(correctEnglish.replace(/am about to|are about to|is about to/g, "will"));
            wrongs.push(correctEnglish.replace(/about to/g, "going to"));
        } else if (type === "spontaneous") {
            wrongs.push("I am going to answer it");
            wrongs.push("I answer it");
        } else if (type === "promise") {
            wrongs.push(correctEnglish.replace("will", "am going to"));
            wrongs.push(correctEnglish.replace("I will", "I"));
        } else if (type === "threat") {
            wrongs.push("I am going to leave");
            wrongs.push("I leave");
        } else if (type === "evidence") {
            wrongs.push(correctEnglish.replace("is going to", "will"));
            wrongs.push(correctEnglish.replace("is going to", "about to"));
        } else {
            wrongs.push(correctEnglish.replace("will", "am going to"));
            wrongs.push(correctEnglish.replace(/will \w+/, "").replace("  ", " "));
        }
        
        if (wrongs.length < 2) {
            wrongs.push(correctEnglish.replace(/\b\w+\b/, "maybe") + " soon");
            wrongs.push(correctEnglish + " later");
        }
        
        return wrongs.slice(0, 2);
    }

    function generateCompleteQuestion() {
        const ukrSentence = generateUkrainianSentence();
        const correctEng = generateCorrectEnglish(ukrSentence);
        const wrongs = generateWrongOptions(correctEng, ukrSentence);
        
        let options = [correctEng, wrongs[0], wrongs[1]];
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        const correctIndex = options.findIndex(opt => opt === correctEng);
        
        return {
            ukr: capitalize(ukrSentence),
            options: options,
            correctIndex: correctIndex,
            correctAnswer: correctEng
        };
    }

    function renderOptions(opts, correctIdx) {
        optionsDiv.innerHTML = "";
        opts.forEach((opt, idx) => {
            const row = document.createElement("div");
            row.className = "option-item";
            const letterSpan = document.createElement("span");
            letterSpan.className = "option-letter";
            letterSpan.innerText = String.fromCharCode(65 + idx);
            const textSpan = document.createElement("span");
            textSpan.className = "option-english";
            textSpan.innerText = opt;
            row.appendChild(letterSpan);
            row.appendChild(textSpan);
            row.addEventListener("click", () => {
                if (answerLock) return;
                handleChoice(idx, correctIdx, opt);
            });
            optionsDiv.appendChild(row);
        });
    }

    function handleChoice(selectedIdx, correctIdx, chosenText) {
        if (answerLock) return;
        answerLock = true;
        const isAnswerCorrect = (selectedIdx === correctIdx);
        const correctAnswer = currentOptions[correctIdx];
        if (isAnswerCorrect) {
            score++;
            feedbackDiv.innerText = `correct. "${correctAnswer}" — exact translation. +1 point.`;
            feedbackDiv.className = "feedback-block feedback-correct";
        } else {
            feedbackDiv.innerText = `incorrect. right answer: "${correctAnswer}". you chose: "${chosenText}". observe the subtle pattern.`;
            feedbackDiv.className = "feedback-block feedback-wrong";
        }
        highlightChoices(selectedIdx, correctIdx, isAnswerCorrect);
        disableOptions(true);
        nextButton.disabled = false;
        answeredCounter++;
        updateProgressAndLabel();
    }

    function highlightChoices(chosen, correct, wasCorrect) {
        const rows = document.querySelectorAll(".option-item");
        rows.forEach((row, idx) => {
            if (idx === correct) {
                row.style.backgroundColor = "#eaf9f0";
                row.style.borderLeft = "3px solid #5fae8b";
            }
            if (!wasCorrect && idx === chosen && idx !== correct) {
                row.style.backgroundColor = "#fff0ea";
                row.style.borderLeft = "3px solid #e09d7c";
            }
        });
    }

    function disableOptions(disabled) {
        const rows = document.querySelectorAll(".option-item");
        rows.forEach(row => {
            if (disabled) {
                row.style.pointerEvents = "none";
                row.classList.add("opt-disabled");
            } else {
                row.style.pointerEvents = "auto";
                row.classList.remove("opt-disabled");
                row.style.backgroundColor = "";
                row.style.borderLeft = "";
            }
        });
    }

    function updateProgressAndLabel() {
        const totalShown = answeredCounter;
        let percent = Math.min(100, (totalShown % 20) * 5);
        if (totalShown < 20) percent = (totalShown / 20) * 100;
        progressFill.style.width = `${percent}%`;
        if (totalShown < 7) levelSpan.innerText = "explorer · generated questions";
        else if (totalShown < 14) levelSpan.innerText = "adept · dynamic patterns";
        else levelSpan.innerText = "master · infinite variety";
    }

    function loadQuestion() {
        currentQuestionData = generateCompleteQuestion();
        currentOptions = currentQuestionData.options;
        currentCorrectIndex = currentQuestionData.correctIndex;
        ukrSpan.innerText = currentQuestionData.ukr;
        renderOptions(currentOptions, currentCorrectIndex);
        answerLock = false;
        nextButton.disabled = true;
        feedbackDiv.innerText = "";
        feedbackDiv.className = "feedback-block";
        disableOptions(false);
    }

    function nextHandler() {
        if (!answerLock && nextButton.disabled) return;
        if (nextButton.disabled) return;
        loadQuestion();
    }

    function finishTest() {
        answerLock = true;
        disableOptions(true);
        nextButton.disabled = true;
        ukrSpan.innerText = "test completed — summary";
        optionsDiv.innerHTML = `<div style="background:#fefaf5; border:1px solid #e4e9ef; padding: 1.8rem; text-align:center; margin-top:10px;">
            <strong>final result</strong><br>
            total questions answered: ${answeredCounter}<br>
            correct answers: ${score}<br>
            thank you for training will / going to / about to.
            </div>`;
        feedbackDiv.innerText = "";
        progressFill.style.width = "100%";
    }

    function resetGame() {
        answeredCounter = 0;
        score = 0;
        answerLock = false;
        loadQuestion();
        updateProgressAndLabel();
        nextButton.disabled = true;
        feedbackDiv.innerText = "";
        feedbackDiv.className = "feedback-block";
        disableOptions(false);
    }

    loadQuestion();
    updateProgressAndLabel();

    nextButton.addEventListener("click", nextHandler);
    finishButton.addEventListener("click", finishTest);
    resetButton.addEventListener("click", resetGame);
})();
</script>
</body>
</html>
